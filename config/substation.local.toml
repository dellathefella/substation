[daemon]
bind = "127.0.0.1"
port = 8800
webui_dist = "./webui/dist"
auth_token = ""
session_stick_seconds = 300
max_concurrent_requests = 8
start_on_login = false

[cluster]
enabled = false
controller_id = "local"
heartbeat_ms = 2000

[orchestrator]
triage_gguf = "models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
triage_port = 8931
triage_timeout_ms = 400
triage_upgrade_confidence = 0.8
cache_enabled = true
cache_max_entries = 256
# Fallback model when auto routing but the orchestrator is unavailable.
# Empty → smallest catalog model. If neither exists → "no model loaded" error.
default_model = ""
# Start with ONLY the orchestrator resident; big tiers load on first request.
idle_load_only = true

[orchestrator.tiers.fast]
models = ["qwen2.5-1.5b"]
[orchestrator.tiers.balanced]
models = ["qwen2.5-7b"]
[orchestrator.tiers.smart]
models = ["qwen2.5-7b"]

[engines]
llama_server = "./third_party/llama.cpp/build/bin/llama-server"
rpc_server = "./third_party/llama.cpp/build/bin/ggml-rpc-server"
base_port = 8940
startup_timeout_s = 300
idle_evict_seconds = 900
min_free_ram_gb = 8
default_ctx = 8192

[metrics]
sample_interval_ms = 1000
event_ring_size = 2000
ws_tick_batch_ms = 250

[[models]]
name = "qwen2.5-1.5b"
gguf = "models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
tier = "fast"
size_gb = 1.1
ctx = 4096
placement = "local"

[[models]]
name = "qwen2.5-7b"
gguf = "models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf"
tier = "balanced"
size_gb = 4.7
ctx = 4096
placement = "local"
